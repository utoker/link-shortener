ignoredBuiltDependencies:
  - esbuild

onlyBuiltDependencies:
  - '@tailwindcss/oxide'
  - sharp

# Next.js pins postcss 8.4.31, which has known advisories (build-time only,
# sourceMappingURL file reads); use a fixed 8.5 release everywhere.
overrides:
  postcss: 8.5.31
  # A build-time tool with known advisories whose parent still allows an older
  # release; the fixed version is within the range the parent asks for.
  # tar: unpacking archives (@tailwindcss/oxide).
  tar: 7.5.22
