ignoredBuiltDependencies:
  - esbuild

onlyBuiltDependencies:
  - '@tailwindcss/oxide'
  - sharp

# One postcss for everything. Next.js 15 pinned 8.4.31, which had known
# advisories (build-time only, sourceMappingURL file reads); Next.js 16's
# 8.5.23 has none, but a single fixed release keeps the CSS build predictable.
overrides:
  postcss: 8.5.31
  # A build-time tool with known advisories whose parent still allows an older
  # release; the fixed version is within the range the parent asks for.
  # tar: unpacking archives (@tailwindcss/oxide).
  tar: 7.5.22
